apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-service
  namespace: fluxchat
  labels:
    app: websocket-service
    app.kubernetes.io/name: websocket-service
    app.kubernetes.io/component: realtime
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: websocket-service
  template:
    metadata:
      labels:
        app: websocket-service
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: websocket-service
          image: fluxchat-websocket-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: ws
              containerPort: 8005
          envFrom:
            - configMapRef:
                name: fluxchat-config
            - secretRef:
                name: fluxchat-secrets
          env:
            - name: PORT
              value: "8005"
            - name: HOST
              value: "0.0.0.0"
          resources:
            requests:
              cpu: 150m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: websocket-service
  namespace: fluxchat
  labels:
    app: websocket-service
    app.kubernetes.io/name: websocket-service
spec:
  type: ClusterIP
  selector:
    app: websocket-service
  ports:
    - name: ws
      port: 8005
      targetPort: 8005
      protocol: TCP
