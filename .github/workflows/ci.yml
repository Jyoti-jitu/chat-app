name: FluxChat Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ============================================================================
  # Frontend Validation (Next.js 15 App Router, TypeScript, Lint, Production Build)
  # ============================================================================
  frontend:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Next.js Production Build Validation
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws

  # ============================================================================
  # Backend Microservices & Shared Infrastructure Testing
  # ============================================================================
  backend:
    name: Backend Test Suites & Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r services/auth-service/requirements.txt

      - name: Run Shared Infrastructure, Security & Rate Limiting Tests
        run: |
          PYTHONPATH=. pytest shared/ -v

      - name: Run API Gateway Proxy & Route Unit Tests
        run: |
          cd services/api-gateway
          PYTHONPATH=.:../.. pytest tests/ -v
